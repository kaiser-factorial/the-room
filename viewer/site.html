<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>the room — the room's own site</title>
<style>
  :root { --bg: #0e0e11; --panel: #17171c; --text: #e8e6e1; --dim: #8a8794; --line: #26262e; --accent: #6fce6f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Iowan Old Style", Georgia, serif;
    display: flex; flex-direction: column;
  }
  /* The strip is the only thing on this page that is OURS. Everything below
     it was written by the room. It stays visually separate for that reason —
     a viewer must never be unsure which is which. */
  header {
    display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap;
    padding: 0.5rem 1rem; border-bottom: 1px solid var(--line); background: var(--bg);
    font-size: 0.8rem; color: var(--dim);
  }
  header b { color: var(--text); font-weight: normal; letter-spacing: 0.12em; font-size: 0.8rem; }
  header a { color: var(--dim); }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 0.2rem 0.45rem; font: inherit; font-size: 0.75rem; cursor: pointer;
  }
  button[disabled] { color: var(--line); cursor: default; }
  #versions { display: flex; align-items: center; gap: 0.35rem; }
  /* Same trap as .switch: without this, `hidden` does nothing here because
     the rule above already set a display. */
  #versions[hidden] { display: none; }
  #vcount { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
  #scrub { width: 9rem; accent-color: var(--accent); cursor: pointer; }
  #who { color: var(--dim); }
  /* The same control as the transcript viewer's — two views of one session. */
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .switch a {
    padding: 0.2rem 0.6rem; font-size: 0.75rem; color: var(--dim);
    text-decoration: none; background: var(--panel);
  }
  .switch a.on { color: var(--text); background: var(--line); }
  #live { color: var(--accent); }
  #wrap { flex: 1; min-height: 0; display: flex; }
  iframe { flex: 1; border: 0; background: #fff; }
  #empty { margin: auto; max-width: 30rem; padding: 2rem; text-align: center; color: var(--dim); }
</style>
</head>
<body>

<header>
  <b>THE ROOM</b>
  <select id="sessions" title="which room's page"></select>
  <span id="versions" hidden>
    <button id="prev" title="previous version (←)">‹</button>
    <input type="range" id="scrub" min="1" max="1" value="1" title="version" />
    <button id="next" title="next version (→)">›</button>
    <span id="vcount"></span>
    <button id="latest" title="follow the newest version">latest</button>
  </span>
  <span id="who"></span>
  <span id="live"></span>
  <span style="margin-left:auto; display:flex; gap:0.6rem; align-items:center">
    <span class="switch">
      <a id="toChat" href="./index.html">chat</a><a class="on" id="toSite" href="#">site</a>
    </span>
    <button id="hide">hide this bar</button>
  </span>
</header>

<div id="wrap"><div id="empty">The room has not written this page yet.</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Same project + anon key as the viewer: room_events is public-read.
const SUPABASE_URL = 'https://wfrxfhpiuxofmfdjpuvv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcnhmaHBpdXhvZm1mZGpwdXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMDk0NzIsImV4cCI6MjA5ODc4NTQ3Mn0.cpBDy6DUtj_m9esL4bGCjTp7V0m-sCuG5cxHxZ5iZg0';
const supabase = createClient(SUPABASE_URL, ANON_KEY);
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.search);
// ?file= for a room that named its page something else.
const FILE = params.get('file') || 'index.html';

// This page is scoped to ONE session, because the page belongs to the room
// that wrote it — and because every write is its own event, which makes the
// whole history browsable: v1 → vN, each with its author and round. The room
// is never told any of this exists; it is a read-only view of the mirror.
let session = params.get('session') || null;
// `versions` holds METADATA ONLY — id, seq, ts, round, author. The pages
// themselves are fetched one at a time, by id, and cached. A site room's
// page is up to 60k characters and every version is its own row, so the
// obvious `select('*')` turns a dropdown into a multi-megabyte download
// (86 file rows in the mirror today already carry ~957 KB of payload, and
// the session poll re-ran that query every 15 seconds).
let versions = [];   // every non-refused write of FILE in this session, oldest first
let content = new Map(); // row id -> payload, once fetched (or delivered live)
let at = -1;         // which version is on screen
let follow = true;   // stay on the newest as writes land (false once you scrub back)
let channel = null;
let renderSeq = 0;   // guards against a slow fetch landing after a newer scrub

const fmt = (ts) => new Date(ts).toLocaleString();

/** Render one version.
 *
 *  sandbox WITHOUT allow-same-origin: the room's page runs in an opaque
 *  origin, so scripts in it (which the room may well write — it is a
 *  website) cannot touch this page, its storage, or the viewer's Supabase
 *  session. srcdoc rather than a blob URL for the same reason: a blob: URL
 *  inherits this origin. The room gets a real browser; it does not get our
 *  credentials. */
/** The page for one version. Realtime hands us the payload with the row;
 *  everything else is fetched once, by id, and kept. */
async function pageFor(row) {
  if (row.payload) { content.set(row.id, row.payload); return row.payload; }
  if (content.has(row.id)) return content.get(row.id);
  const { data, error } = await supabase.from('room_events').select('payload').eq('id', row.id).maybeSingle();
  if (error || !data) return null;
  content.set(row.id, data.payload);
  return data.payload;
}

async function render() {
  const row = versions[at];
  if (!row) return;
  const mine = ++renderSeq;
  $('versions').hidden = versions.length < 1;
  $('scrub').max = String(versions.length);
  $('scrub').value = String(at + 1);
  $('vcount').textContent = `v${at + 1} / ${versions.length}`;
  $('prev').disabled = at === 0;
  $('next').disabled = at === versions.length - 1;
  // `hidden`, not a cleared inline display: the button also has a CSS rule
  // in the stylesheet, and style.display='' hands control straight back to
  // it — the button never reappeared after scrubbing back (caught in the
  // browser check, not by reading).
  $('latest').hidden = follow;
  $('who').textContent = `${FILE} · ${row.agent_name} · round ${row.round} · ${fmt(row.ts)}`;
  // The switch hands this session back to the transcript view, so the two
  // are always looking at the same room.
  $('toChat').href = `./index.html?session=${encodeURIComponent(row.session_id)}`;
  // A version is a link: the URL always says exactly what is on screen.
  const q = new URLSearchParams({ session: row.session_id, v: String(at + 1) });
  if (FILE !== 'index.html') q.set('file', FILE);
  history.replaceState(null, '', `?${q}`);

  const p = await pageFor(row);
  // Scrubbing fast can resolve fetches out of order; only the newest paints.
  if (mine !== renderSeq || !p) return;
  let frame = document.querySelector('#wrap iframe');
  if (!frame) {
    $('wrap').innerHTML = '';
    frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms allow-modals');
    frame.title = "the room's website";
    $('wrap').appendChild(frame);
  }
  // Base64 is the binary marker (a python-published file); a page written
  // with [WRITE] arrives as text.
  frame.srcdoc = p.encoding === 'base64' ? atob(p.content || '') : (p.content || '');
}

function goTo(i, byHand) {
  if (!versions.length) return;
  at = Math.max(0, Math.min(versions.length - 1, i));
  if (byHand) follow = at === versions.length - 1;
  void render();
}

/** Sessions that have written this file, newest first. */
async function loadSessions() {
  const { data, error } = await supabase.from('room_events')
    // Not `payload` — see the note on `versions`. `denied` comes back as
    // the string 'true' or null, which is all this needs.
    .select('session_id, ts, denied:payload->>denied')
    .eq('kind', 'file').eq('payload->>name', FILE)
    // ts, not seq: seq is a per-runner-process counter and does not order
    // rows ACROSS sessions. Within a session it still de-duplicates.
    .order('ts', { ascending: false }).limit(1000);
  if (error) { $('who').textContent = error.message; return []; }
  const seen = new Set();
  const out = [];
  for (const r of data || []) {
    if (r.denied || seen.has(r.session_id)) continue;
    seen.add(r.session_id);
    out.push({ id: r.session_id, ts: r.ts });
  }
  return out;
}

function fillSessions(sessions) {
  const sel = $('sessions');
  const same = sel.options.length === sessions.length &&
    [...sel.options].every((o, i) => o.value === sessions[i].id);
  if (same) { sel.value = session ?? sel.value; return; }
  sel.innerHTML = '';
  for (const s of sessions) {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.id;
    sel.appendChild(o);
  }
  if (session) sel.value = session;
}

/** Every version of the file in one session, oldest first. */
async function loadVersions(sessionId) {
  const { data, error } = await supabase.from('room_events')
    .select('id, seq, ts, round, agent_name, session_id, denied:payload->>denied')
    .eq('kind', 'file').eq('payload->>name', FILE).eq('session_id', sessionId)
    .order('ts', { ascending: true }).limit(500);
  if (error) { $('who').textContent = error.message; return []; }
  return (data || []).filter((r) => !r.denied);
}

async function show(sessionId, wantVersion) {
  session = sessionId;
  $('sessions').value = sessionId;
  versions = await loadVersions(sessionId);
  $('toChat').href = `./index.html?session=${encodeURIComponent(sessionId)}`;
  if (!versions.length) {
    $('wrap').innerHTML = '<div id="empty">This room has not written the page yet.</div>';
    $('versions').hidden = true;
    $('who').textContent = '';
    await watch(sessionId);
    return;
  }
  const v = Number(wantVersion);
  const start = Number.isInteger(v) && v >= 1 && v <= versions.length ? v - 1 : versions.length - 1;
  follow = start === versions.length - 1;
  goTo(start);
  await watch(sessionId);
}

async function watch(sessionId) {
  if (channel) { supabase.removeChannel(channel); channel = null; }
  channel = supabase
    .channel(`site-${sessionId}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'room_events', filter: `session_id=eq.${sessionId}` },
      (p) => {
        try {
          const r = p.new;
          if (r.kind === 'end') { $('live').textContent = ''; return; }
          if (r.kind !== 'file' || r.payload?.name !== FILE || r.payload?.denied) return;
          if (versions.some((x) => x.seq === r.seq)) return;
          content.set(r.id, r.payload);
          versions.push(r);
          // Someone reading an older version is not yanked forward; the
          // counter grows under them and `latest` takes them to the end.
          goTo(follow ? versions.length - 1 : at);
        } catch (err) { console.error('site render:', err); }
      })
    .subscribe((s) => { $('live').textContent = s === 'SUBSCRIBED' ? 'live' : ''; });
}

$('sessions').onchange = (e) => show(e.target.value);
$('prev').onclick = () => goTo(at - 1, true);
$('next').onclick = () => goTo(at + 1, true);
$('scrub').oninput = (e) => goTo(Number(e.target.value) - 1, true);
$('latest').onclick = () => { follow = true; goTo(versions.length - 1); };
$('hide').onclick = () => { document.querySelector('header').style.display = 'none'; };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(at - 1, true);
  if (e.key === 'ArrowRight') goTo(at + 1, true);
});

const sessions = await loadSessions();
if (sessions.length) {
  fillSessions(sessions);
  await show(session && sessions.some((s) => s.id === session) ? session : sessions[0].id, params.get('v'));
}

// Realtime carries the session on screen; the poll notices a NEW session
// starting its own page, and catches anything realtime dropped. Neither
// moves you off the session you are reading — that is the select's job.
setInterval(async () => {
  const fresh = await loadSessions();
  if (!fresh.length) return;
  fillSessions(fresh);
  if (!session) { await show(fresh[0].id); return; }
  if (session === fresh[0].id && follow) {
    const rows = await loadVersions(session);
    if (rows.length > versions.length) { versions = rows; goTo(versions.length - 1); }
  }
}, 15000);
</script>
</body>
</html>
