<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>the room — the room's own site</title>
<style>
  :root { --bg: #0e0e11; --text: #e8e6e1; --dim: #8a8794; --line: #26262e; --accent: #6fce6f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Iowan Old Style", Georgia, serif;
    display: flex; flex-direction: column;
  }
  /* The strip is the only thing on this page that is OURS. Everything below
     it was written by the room. It stays visually separate from the site
     for that reason — a viewer must never be unsure which is which. */
  header {
    display: flex; gap: 0.9rem; align-items: baseline; flex-wrap: wrap;
    padding: 0.55rem 1rem; border-bottom: 1px solid var(--line); background: var(--bg);
    font-size: 0.8rem; color: var(--dim);
  }
  header b { color: var(--text); font-weight: normal; letter-spacing: 0.12em; }
  header a { color: var(--dim); }
  #live { color: var(--accent); }
  #wrap { flex: 1; min-height: 0; display: flex; }
  iframe { flex: 1; border: 0; background: #fff; }
  #empty { margin: auto; max-width: 30rem; padding: 2rem; text-align: center; color: var(--dim); }
  button { background: none; color: var(--dim); border: 1px solid var(--line); padding: 0.2rem 0.5rem; font: inherit; font-size: 0.75rem; cursor: pointer; }
</style>
</head>
<body>

<header>
  <b>THE ROOM</b>
  <span id="what">looking for the room's site…</span>
  <span id="live"></span>
  <span style="margin-left:auto; display:flex; gap:0.6rem; align-items:baseline">
    <a id="transcript" href="./index.html">watch the room</a>
    <button id="hide">hide this bar</button>
  </span>
</header>

<div id="wrap"><div id="empty">The room has not written this page yet.</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Same project + anon key as the viewer: room_events is public-read.
const SUPABASE_URL = 'https://wfrxfhpiuxofmfdjpuvv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcnhmaHBpdXhvZm1mZGpwdXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMDk0NzIsImV4cCI6MjA5ODc4NTQ3Mn0.cpBDy6DUtj_m9esL4bGCjTp7V0m-sCuG5cxHxZ5iZg0';
const supabase = createClient(SUPABASE_URL, ANON_KEY);
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.search);
// ?file= for a room that named its page something else; ?session= pins one
// session (otherwise: whichever session most recently wrote the file, which
// during a live site room is that room).
const FILE = params.get('file') || 'index.html';
const PINNED = params.get('session') || null;

let session = null;      // session currently on screen
let lastSeq = -1;        // newest file-event seq rendered
let channel = null;

/** Render one file event into the frame.
 *
 *  sandbox WITHOUT allow-same-origin: the room's page runs in an opaque
 *  origin, so scripts in it (which the room may well write — it is a
 *  website) cannot touch this page, its storage, or the viewer's Supabase
 *  session. srcdoc rather than a blob URL for the same reason: a blob:
 *  URL inherits this origin. The room gets a real browser; it does not get
 *  our credentials. */
function show(row) {
  const p = row.payload || {};
  if (p.denied) return;
  if (row.seq <= lastSeq) return;
  lastSeq = row.seq;
  let frame = document.querySelector('#wrap iframe');
  if (!frame) {
    $('wrap').innerHTML = '';
    frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms allow-modals');
    frame.title = "the room's website";
    $('wrap').appendChild(frame);
  }
  // Base64 is the binary marker (a python-published file); the page itself
  // is written with [WRITE] and arrives as text.
  frame.srcdoc = p.encoding === 'base64' ? atob(p.content || '') : (p.content || '');
  $('what').textContent = `${FILE} · ${row.agent_name} · round ${row.round} · ${new Date(row.ts).toLocaleString()}`;
}

/** Newest version of the file, across sessions or within the pinned one. */
async function latest() {
  let q = supabase.from('room_events').select('*')
    .eq('kind', 'file').eq('payload->>name', FILE)
    // ts, not seq: seq is a per-runner-process counter, so it does not
    // order rows ACROSS sessions — "the newest page anyone wrote" needs a
    // clock. Within a session seq still de-duplicates (show()).
    .order('ts', { ascending: false }).limit(20);
  if (PINNED) q = q.eq('session_id', PINNED);
  const { data, error } = await q;
  if (error) { $('what').textContent = error.message; return null; }
  // Newest first; skip refused writes, which carry the name and no content.
  return (data || []).find((r) => !r.payload?.denied) || null;
}

async function watch(sessionId) {
  if (channel) { supabase.removeChannel(channel); channel = null; }
  session = sessionId;
  channel = supabase
    .channel(`site-${sessionId}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'room_events', filter: `session_id=eq.${sessionId}` },
      (p) => {
        try {
          const r = p.new;
          if (r.kind === 'file' && r.payload?.name === FILE) show(r);
          if (r.kind === 'end') $('live').textContent = '';
        } catch (err) { console.error('site render:', err); }
      })
    .subscribe((s) => { $('live').textContent = s === 'SUBSCRIBED' ? 'live' : ''; });
}

async function tick() {
  const row = await latest();
  if (!row) return;
  // A newer session started writing its own page: follow it. (The room's
  // site is whatever the room most recently built, not a frozen copy.)
  if (row.session_id !== session) { lastSeq = -1; await watch(row.session_id); }
  show(row);
}

$('hide').onclick = () => { document.querySelector('header').style.display = 'none'; };

await tick();
// Realtime carries a live room; the poll covers a session that started
// while this page was open, and any event realtime dropped.
setInterval(tick, 15000);
</script>
</body>
</html>
