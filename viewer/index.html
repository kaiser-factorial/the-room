const CONDITIONS = ['control', 'house', 'countdown-visible', 'journal-silent', 'journal-free', 'floor', 'context-window', 'roster-hidden', 'trace-rich', 'search-tool', 'search-free', 'gated', 'tools-full', 'tools-scarce', 'agentic', 'agentic-native', 'identity-swap', 'broadcast-informed', 'broadcast-uninformed', 'transparent', 'self-governing', 'site', 'site-native', 'site-open', 'site-unwitnessed', 'site-unending', 'site-open-unending', 'project', 'project-unending', 'site-open-whittle', 'project-whittle'];
const ADMIN_COLOR = '#e8e6e1';
// The file the site view renders (site.html's default). A room that writes
// it gets the site half of the switch in the header.
const SITE_FILE = 'index.html';
// Whether THIS session wrote a file or ran any code — what the `made` view
// needs, and a wider test than "wrote a page": a project room that never
// makes an index.html still has a workspace worth opening.
let madeSomething = false;

const supabase = createClient(SUPABASE_URL, ANON_KEY);
const $ = (id) => document.getElementById(id);
const feed = $('feed'), statusEl = $('status'), dot = $('dot'), clock = $('clock');

// meta payload (colors, endsAt) for the session being viewed
let meta = null;
let ended = false;
let clockTimer = null;

const colorOf = (id) =>
  id === 'admin' ? ADMIN_COLOR
  : meta?.agents?.find((a) => a.id === id)?.color
  ?? CATALOG.find((a) => a.id === id)?.color
  ?? `hsl(${[...(id || '?')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7)} 55% 68%)`;

function setStatus(state) {
  statusEl.textContent = state;
  dot.className = state === 'live' ? 'live' : state === 'session over' ? 'ended' : '';
}

function tickClock() {
  if (!meta?.endsAt || ended) { if (ended) clock.textContent = ''; return; }
  const ms = new Date(meta.endsAt).getTime() - Date.now();
  if (ms <= 0) {
    clock.textContent = '0:00';
    // Countdown hit zero with no end event — treat as over (covers a dead runner).
    setStatus('session over');
    return;
  }
  const s = Math.floor(ms / 1000);
  clock.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function render(e) {
  if (e.seq !== undefined) {
    if (seenEventSeqs.has(e.seq)) return;
    seenEventSeqs.add(e.seq);
  }
  if (e.kind === 'meta') {
    meta = e.payload; ended = false;
    // Condition badge next to the status: condition name + batch position.
    const b = meta?.batch;
    $('cond').textContent = (meta?.condition?.name || '') + (b ? ` · ${b.name} ${b.index + 1}/${b.total}` : '');
    clearInterval(clockTimer); clockTimer = setInterval(tickClock, 1000); tickClock();
    return;
  }
  if (e.kind === 'end') {
    ended = true; clock.textContent = '';
    setStatus('session over');
    return;
  }
  const el = document.createElement('div');
  // The row's own id, so a cross-run search result can land on the exact
  // event it matched rather than just the right session.
  if (e.id !== undefined) el.dataset.eventId = String(e.id);
  if (e.kind === 'message') {
    el.className = 'msg';
    el.innerHTML = `<div class="who"></div><div class="body"></div>`;
    el.querySelector('.who').textContent = e.agent_name;
    el.querySelector('.who').style.color = colorOf(e.agent_id);
    el.querySelector('.body').textContent = e.text;
    // Thinking precedes speech — the chevron sits between name and message.
    appendThinking(el, e, el.querySelector('.body'));
  } else if (e.kind === 'journal') {
    el.className = 'aside';
    el.textContent = `${e.agent_name} stepped away to write in their journal.`;
    appendThinking(el, e);
  } else if (e.kind === 'search') {
    // F4 websearch. The room at most heard the notice line; humans get the
    // query + results behind a chevron (same class as thinking traces).
    renderToolCall(e);
    el.className = 'aside';
    el.textContent = e.payload?.denied
      ? `${e.agent_name} reached for the web, but no results came back.`
      : `${e.agent_name} looked something up on the web.`;
    const d = document.createElement('details');
    d.className = 'thinking';
    const s = document.createElement('summary');
    s.textContent = 'search';
    const body = document.createElement('div');
    body.className = 'trace';
    body.textContent = `[${e.payload?.query || ''}]` + (e.payload?.results ? `\n\n${e.payload.results}` : '');
    d.append(s, body);
    el.appendChild(d);
    appendThinking(el, e);
  } else if (e.kind === 'file' || e.kind === 'run') {
    // F4½ tools. File contents are room-public; run code/output are private
    // to the caller — humans get both behind a chevron either way.
    // File events also feed the shared-files rail (current state, like
    // the journals rail keeps the entries); runs feed the tool-calls rail.
    if (e.kind === 'file') renderSharedFile(e);
    if (e.kind === 'run') renderToolCall(e);
    // A refused write made nothing; a refused run still shows in the
    // workspace as an attempt, which is why only the file case is gated.
    if (e.kind === 'run' || !e.payload?.denied) { madeSomething = true; updateViews(); }
    el.className = 'aside';
    el.textContent = e.kind === 'file'
      ? (e.payload?.denied
          ? `${e.agent_name} tried to ${e.payload?.deleted ? 'delete' : 'write'} a shared file, but it was refused.`
          : e.payload?.deleted
            ? `${e.agent_name} deleted the shared file "${e.payload?.name}".`
            : `${e.agent_name} updated the shared file "${e.payload?.name}".`)
      : (e.payload?.denied ? `${e.agent_name} tried to run some code, but it was refused.`
                           : `${e.agent_name} ran some code.`);
    const d = document.createElement('details');
    d.className = 'thinking';
    const s = document.createElement('summary');
    // "code" here plus a "code" label inside the block said it twice; the
    // chevron names the EVENT, the labels name its two halves.
    s.textContent = e.kind === 'file' ? 'file' : 'run';
    const body = document.createElement('div');
    body.className = 'trace';
    if (e.kind === 'file' && e.payload?.encoding === 'base64') {
      // Binary (python-published) file. Render images inline; anything
      // else gets a size line. Data URI from our own mirror payload.
      const ext = (e.payload.name || '').split('.').pop().toLowerCase();
      const mime = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' }[ext];
      if (mime) {
        const img = document.createElement('img');
        img.src = `data:${mime};base64,${e.payload.content}`;
        img.alt = e.payload.name;
        img.style.maxWidth = '100%';
        body.appendChild(img);
      } else {
        body.textContent = `(binary file, ${Math.round((e.payload.content || '').length * 3 / 4 / 1024)} KB)`;
      }
    } else if (e.kind === 'run') {
      body.className = '';                       // the run blocks bring their own
      body.appendChild(runBlock(e.payload || {}));
      el.classList.add('hasrun');
    } else {
      body.textContent = e.payload?.content || '(empty)';
    }
    d.append(s, body);
    el.appendChild(d);
    appendThinking(el, e);
  } else if (e.kind === 'config') {
    el.className = 'aside';
    el.textContent = e.payload?.denied
      ? `${e.agent_name} tried to change the room's settings, but it was refused.`
      : `${e.agent_name} changed the room's settings: ${e.payload?.key} = ${e.payload?.value}`;
    appendThinking(el, e);
  } else if (e.kind === 'source') {
    renderToolCall(e);
    el.className = 'aside';
    // Name the FILE that was read, not the alias that was typed — and say
    // plainly when a bare [SOURCE] fetched the index, or when the name did
    // not resolve. "read the room's source code" was true of all three.
    {
      const sp = e.payload || {};
      el.textContent = sp.index
        ? `${e.agent_name} read the index of the room's source (${sp.index.length} readable: ${sp.index.join(', ')}).`
        : sp.found === false
          ? `${e.agent_name} looked for "${sp.name}" in the room's source, which isn't readable here.`
          : sp.file
            ? `${e.agent_name} read the room's source code — ${sp.file}.`
            : `${e.agent_name} read the room's source code${sp.name ? ` (${sp.name})` : ''}.`;
    }
    appendThinking(el, e);
  } else if (e.kind === 'system') {
    // Three silences that read identically in a transcript and are not the
    // same event at all: a seat that DECLINED its turn, a seat whose reply
    // came back empty (usually reasoning eating the visible budget), and a
    // call that failed. Only the first is a decision, and it is the one the
    // floor axis exists to measure — so it gets the agent's colour and a
    // label, and the other two say what actually happened.
    const silence = /chose to say nothing/.test(e.text) ? 'chosen'
      : /could not speak/.test(e.text) ? 'error'
      : /said nothing this turn/.test(e.text) ? 'empty' : null;
    el.className = silence ? `aside silence ${silence}` : 'aside';
    if (silence) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = silence === 'chosen' ? 'passed' : silence === 'error' ? 'failed' : 'no words';
      if (silence === 'chosen') tag.style.color = colorOf(e.agent_id);
      const line = document.createElement('span');
      line.textContent = e.text;
      el.append(tag, line);
      // For an empty reply, the numbers ARE the explanation: how much of the
      // turn went on thinking, and whether the completion hit the cap.
      const u = e.payload?.telemetry?.usage;
      if (silence === 'empty' && (u?.reasoning || e.payload?.telemetry?.finishReason)) {
        const why = document.createElement('span');
        why.className = 'why';
        why.textContent = [
          u?.reasoning ? `${u.reasoning} tokens of thinking` : null,
          u?.completion !== undefined ? `${u.completion} completion` : null,
          e.payload.telemetry.finishReason ? `finish: ${e.payload.telemetry.finishReason}` : null,
        ].filter(Boolean).join(' · ');
        el.appendChild(why);
      }
    } else {
      el.textContent = e.text;
    }
    appendThinking(el, e);
  } else if (e.kind === 'order') {
    el.className = 'order';
    el.textContent = `round ${e.round} · order: ${(e.order_ids || []).join(' → ')}`;
  } else return; // summaries are loop bookkeeping, not feed content
  noteRound(e, placeInFeed(e, el));
}

// ── Tool-run grouping ──────────────────────────────────────────────────────
// A turn can spend four actions before it speaks, and one aside each floods
// the feed — the room's own conversation ends up a minority of its transcript.
// Consecutive tool asides FROM THE SAME SEAT IN THE SAME ROUND collapse behind
// one row ("Opus 5 · 3 actions"). joint-session's ToolActivity groups any run
// of consecutive tool messages regardless of author; here a run belongs to one
// seat's turn by construction, and saying whose turn it was is most of the
// value, so the run is keyed on the seat.
//
// The FIRST call stays inline: hiding a single action behind a disclosure
// costs a click and saves nothing. The group forms when a second arrives, and
// the first is moved into it.
const TOOL_KINDS = new Set(['file', 'run', 'search', 'source', 'config']);
let toolRun = null;   // { agentId, round, count, details, body, firstEl }

function placeInFeed(e, el) {
  if (!TOOL_KINDS.has(e.kind) || !e.agent_id) {
    toolRun = null;
    feed.appendChild(el);
    return el;
  }
  const sameRun = toolRun && toolRun.agentId === e.agent_id && toolRun.round === e.round;
  if (!sameRun) {
    toolRun = { agentId: e.agent_id, round: e.round, count: 1, details: null, body: null, firstEl: el };
    feed.appendChild(el);
    return el;
  }
  if (!toolRun.details) {
    // Second call in the run: build the group and move the first one in.
    const d = document.createElement('details');
    d.className = 'toolrun';
    const sum = document.createElement('summary');
    const body = document.createElement('div');
    body.className = 'tbody';
    d.append(sum, body);
    feed.replaceChild(d, toolRun.firstEl);
    body.appendChild(toolRun.firstEl);
    toolRun.details = d; toolRun.body = body;
  }
  toolRun.body.appendChild(el);
  toolRun.count++;
  const name = e.agent_name || e.agent_id;
  toolRun.details.querySelector('summary').textContent = `${name} · ${toolRun.count} actions`;
  // The GROUP is the round rail's jump target: landing on an element inside a
  // collapsed disclosure scrolls to something the reader cannot see.
  return toolRun.details;
}

// Reasoning trace behind a chevron (F1). Traces ride in payload.thinking on
// message/journal/system rows; textContent keeps them injection-safe.
// `before` places the chevron ahead of that node (thinking precedes speech).
function appendThinking(el, e, before) {
  const t = e.payload?.thinking;
  if (!t) return;
  const d = document.createElement('details');
  d.className = 'thinking';
  const s = document.createElement('summary');
  s.textContent = 'thinking';
  const body = document.createElement('div');
  body.className = 'trace';
  body.textContent = t;
  d.append(s, body);
  if (before) el.insertBefore(d, before);
  else el.appendChild(d);
}

// ── Shared-files rail (F4½) ────────────────────────────────────────────────
// Mirrors the journals rail, but shows the CURRENT state of the shared
// filesystem: one entry per file name, updated in place on every write
// (the feed keeps the history; this rail is "what's in the room now").
const fileList = $('fileList');
const fileSections = new Map(); // name -> {details, body, metaEl, versions}
const IMG_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' };

function renderSharedFile(e) {
  const { name, content, encoding, denied, deleted } = e.payload || {};
  if (!name || denied) return;
  $('filesWrap').hidden = false;
  let sec = fileSections.get(name);
  if (!sec) {
    const details = document.createElement('details');
    const summaryEl = document.createElement('summary');
    summaryEl.innerHTML = `<span></span> <span class="count"></span>`;
    summaryEl.querySelector('span').textContent = name;
    const metaEl = document.createElement('div');
    metaEl.className = 'filemeta';
    const body = document.createElement('div');
    body.className = 'filebody';
    details.append(summaryEl, metaEl, body);
    fileList.appendChild(details);
    sec = { details, body, metaEl, versions: 0, countEl: summaryEl.querySelector('.count') };
    fileSections.set(name, sec);
  }
  sec.versions++;
  sec.countEl.textContent = sec.versions > 1 ? `(v${sec.versions})` : '';
  updateViews();
  // A deleted file keeps its last contents in the rail — the transcript is
  // a record of what the room made, and a file that vanishes without trace
  // would make the deletion unreadable after the fact.
  sec.details.classList.toggle('gone', !!deleted);
  sec.metaEl.textContent = deleted
    ? `deleted by ${e.agent_name} · round ${e.round}`
    : `by ${e.agent_name} · round ${e.round}`;
  sec.metaEl.style.color = '';
  sec.body.innerHTML = '';
  if (encoding === 'base64') {
    const mime = IMG_MIME[(name.split('.').pop() || '').toLowerCase()];
    if (mime) {
      const img = document.createElement('img');
      img.src = `data:${mime};base64,${content}`;
      img.alt = name;
      sec.body.appendChild(img);
    } else {
      sec.body.textContent = `(binary file, ${Math.round((content || '').length * 3 / 4 / 1024)} KB)`;
    }
  } else {
    sec.body.textContent = content || '(empty)';
  }
}

// ── Tool-calls rail (F4/F4½) ───────────────────────────────────────────────
// Per-agent accordion like the journals rail; each call is its own inner
// chevron (round + verb in the summary, query/results or code/output in
// the body). Refused calls are listed and marked.
const toolList = $('toolList');
const toolSections = new Map(); // agent_id -> {body, count, countEl}

function renderToolCall(e) {
  $('toolsWrap').hidden = false;
  let sec = toolSections.get(e.agent_id);
  if (!sec) {
    const details = document.createElement('details');
    const summaryEl = document.createElement('summary');
    summaryEl.innerHTML = `<span></span> <span class="count"></span>`;
    summaryEl.querySelector('span').textContent = e.agent_name;
    summaryEl.querySelector('span').style.color = colorOf(e.agent_id);
    const body = document.createElement('div');
    details.append(summaryEl, body);
    toolList.appendChild(details);
    sec = { body, count: 0, countEl: summaryEl.querySelector('.count') };
    toolSections.set(e.agent_id, sec);
  }
  const p = e.payload || {};
  const verb = e.kind === 'search' ? 'searched' : e.kind === 'run' ? 'ran code' : `read source${p.name ? `: ${p.name}` : ''}`;
  const inner = document.createElement('details');
  const s = document.createElement('summary');
  // F4¾: a multi-step turn stamps each action with its step number, so the
  // rail shows "round 3 · step 2 · ran code" and a turn's chain reads as one.
  s.textContent = `round ${e.round}${p.step ? ` · step ${p.step}` : ''} · ${verb}${p.via === 'sentinel' ? ' (wrote a sentinel)' : ''}${p.denied ? ' (refused)' : ''}`;
  const body = document.createElement('div');
  if (e.kind === 'run') {
    body.appendChild(runBlock(p));
  } else {
    body.className = 'trace';
    body.textContent = e.kind === 'search'
      ? `[${p.query || ''}]${p.results ? `\n\n${p.results}` : ''}`
      : `(${p.name || 'index'})`;
  }
  inner.append(s, body);
  sec.body.appendChild(inner);
  sec.countEl.textContent = `(${++sec.count})`;
}

/** The two halves of a code run, rendered as two blocks rather than one
 *  string with a "── output ──" rule down the middle. Used by BOTH the feed
 *  chevron and the tool-calls rail, and it matches made.html's workspace —
 *  a run should not look like a different thing depending on which view you
 *  read it in. */
function runBlock(p) {
  const wrap = document.createElement('div');
  wrap.className = 'runblock' + (p.denied ? ' refused' : '');
  const block = (label, text, cls) => {
    wrap.appendChild(Object.assign(document.createElement('div'), { className: 'lbl', textContent: label }));
    const pre = document.createElement('pre');
    if (cls) pre.className = cls;
    pre.textContent = text;
    wrap.appendChild(pre);
  };
  if (p.code) block('code', p.code);
  block('output', p.denied ? '(refused — nothing ran)' : (p.output || '(no output)'), 'out');
  return wrap;
}

// ── Journals rail ──────────────────────────────────────────────────────────
const journalList = $('journalList');
const journalSections = new Map(); // agent_id -> {details, body, count}
// Dedup: realtime re-delivers rows after mobile reconnects, which was
// inflating the live rail (a refresh then showed "fewer" — the true count).
const seenJournalIds = new Set();
const seenEventSeqs = new Set();

function renderJournal(j) {
  if (j.id !== undefined) {
    if (seenJournalIds.has(j.id)) return;
    seenJournalIds.add(j.id);
  }
  let sec = journalSections.get(j.agent_id);
  if (!sec) {
    const details = document.createElement('details');
    const summaryEl = document.createElement('summary');
    summaryEl.innerHTML = `<span></span> <span class="count"></span>`;
    summaryEl.querySelector('span').textContent = j.agent_name;
    summaryEl.querySelector('span').style.color = colorOf(j.agent_id);
    const body = document.createElement('div');
    details.append(summaryEl, body);
    journalList.appendChild(details);
    sec = { details, body, count: 0, countEl: summaryEl.querySelector('.count') };
    journalSections.set(j.agent_id, sec);
  }
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<div class="rnd"></div><div></div>`;
  entry.querySelector('.rnd').textContent = `round ${j.round}`;
  entry.children[1].textContent = j.text;
  sec.body.appendChild(entry);
  sec.countEl.textContent = `(${++sec.count})`;
}

// ── Text size ──────────────────────────────────────────────────────────────
// Same shape as joint-session's: clamped, 0.2 steps. Persisted (try/catch —
// a private window throws on localStorage and the viewer must still render).
const ZOOM_MIN = 0.7, ZOOM_MAX = 2.0;
let zoom = 1;
try { zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Number(localStorage.getItem('room-zoom')) || 1)); } catch {}
function applyZoom() {
  feed.style.setProperty('--zoom', `${zoom}rem`);
  try { localStorage.setItem('room-zoom', String(zoom)); } catch {}
}
const stepZoom = (d) => (ev) => {
  ev.preventDefault();
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round((zoom + d) * 10) / 10));
  applyZoom();
  // The rail's squares are positioned from live geometry, so re-measure.
  spyRound();
};
$('zoomIn').onclick = stepZoom(0.2);
$('zoomOut').onclick = stepZoom(-0.2);
applyZoom();

// ── Following the room, or not ─────────────────────────────────────────────
// The page used to scroll to the bottom on every arrival, which makes a fast
// room unreadable: start reading something from four rounds ago and the next
// turn snatches the view away. Now it follows only while you are ALREADY at
// the bottom; otherwise arrivals are counted and offered as a pill.
//
// The scroll position is the WINDOW's here (the feed is not its own
// scrollport), so `atBottom` is measured off documentElement.
let atBottom = true;
let unseen = 0;
const BOTTOM_SLOP = 80;

function measureBottom() {
  const d = document.documentElement;
  atBottom = d.scrollHeight - window.scrollY - window.innerHeight < BOTTOM_SLOP;
  if (atBottom && unseen) { unseen = 0; paintPill(); }
}
function paintPill() {
  const b = $('newPill');
  b.hidden = unseen === 0;
  b.textContent = `↓ ${unseen} new`;
}
const toBottom = (smooth) => {
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  atBottom = true; unseen = 0; paintPill();
};
/** Follow the room, or count what arrived. Called after a live insert. */
function followOrCount(n) {
  if (atBottom) { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }); return; }
  unseen += n;
  paintPill();
}
$('newPill').onclick = () => toBottom(true);
window.addEventListener('scroll', () => { measureBottom(); spyRound(); }, { passive: true });
window.addEventListener('resize', () => { measureBottom(); spyRound(); });

// ── Find in transcript ─────────────────────────────────────────────────────
// A 30-round room is thousands of words and the interesting thing is usually
// one phrase. Filters the feed to matching items — and marks the rail squares
// whose round contains a hit, so a term like "index.html" shows you WHERE in
// the session the room was working on it, not just that it did.
//
// Filtering hides DOM nodes rather than re-rendering: the round rail holds
// element references, and rebuilding the feed under it would leave every jump
// target dangling.
let query = '';
const hitRounds = new Set();
// Disclosures the search opened, so clearing it puts the transcript back the
// way it was rather than leaving a dozen traces hanging open.
const autoOpened = new Set();

function closeAutoOpened() {
  for (const d of autoOpened) d.open = false;
  autoOpened.clear();
}

/** Reveal a match wherever it is buried. A hit can sit inside a collapsed
 *  tool run AND, within it, a collapsed thinking trace — the code and output
 *  of a run are exactly what is worth searching in a build room, and a count
 *  that says "1 of 36" while the reader can see nothing is worse than no
 *  search at all. */
function revealMatch(el) {
  if (el.tagName === 'DETAILS' && !el.open) { el.open = true; autoOpened.add(el); }
  for (const d of el.querySelectorAll('details')) {
    if (!d.open && (d.textContent || '').toLowerCase().includes(query)) {
      d.open = true; autoOpened.add(d);
    }
  }
}

function clearSearch() {
  query = '';
  const f = $('find');
  if (f) f.value = '';
  hitRounds.clear();
  closeAutoOpened();
  $('findCount').textContent = '';
  $('hits').hidden = true;
  for (const el of feed.children) el.hidden = false;
}

function runSearch() {
  query = $('find').value.trim().toLowerCase();
  hitRounds.clear();
  closeAutoOpened();
  // Across all runs the feed is not the thing being filtered — the results
  // panel is — so every row stays visible underneath it.
  if (scope === 'all') {
    for (const el of feed.children) el.hidden = false;
    paintRail();
    scheduleAllSearch();
    return;
  }
  $('hits').hidden = true;
  if (!query) {
    for (const el of feed.children) el.hidden = false;
    $('findCount').textContent = '';
    paintRail();
    return;
  }
  let hits = 0, total = 0;
  for (const el of feed.children) {
    // Round separators are scaffolding, not content: they match nothing and
    // would otherwise survive every search as noise.
    if (el.classList.contains('order')) { el.hidden = true; continue; }
    total++;
    const match = (el.textContent || '').toLowerCase().includes(query);
    el.hidden = !match;
    if (match) {
      hits++;
      const r = Number(el.dataset.round);
      if (Number.isFinite(r) && r > 0) hitRounds.add(r);
      revealMatch(el);
    }
  }
  $('findCount').textContent = `${hits} of ${total}`;
  paintRail();
}
$('find').addEventListener('input', runSearch);

// ── Searching every run ────────────────────────────────────────────────────
// The same box, with a scope switch. "this room" filters the rendered feed;
// "all runs" asks the mirror, because the phrase you remember is usually the
// only thing you remember — not which room said it, or when.
//
// It searches everything a room leaves behind, not just what it SAID: the
// worked example for this feature was "the room that discussed Hofstadter",
// and that word turned out to live only inside a file the room wrote. A
// search that covered speech alone would have failed the case it was built
// for.
const mk = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

let scope = 'room';
let allTimer = null;
let allSeq = 0;

const SOURCES = ['text', 'payload->>content', 'payload->>thinking', 'payload->>code',
                 'payload->>output', 'payload->>query', 'payload->>results'];

/** PostgREST splits an `or=(…)` list on commas, so a query containing one
 *  has to be quoted — and then its own quotes and backslashes escaped. */
const likeValue = (q) => `"*${q.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}*"`;

const VERB = {
  message: 'said', system: 'the room', journal: 'journal entry', file: 'wrote',
  run: 'ran code', search: 'searched the web', source: 'read the source',
  config: 'changed a setting',
};

function scheduleAllSearch() {
  clearTimeout(allTimer);
  const q = query;
  if (q.length < 2) {
    $('hits').hidden = true;
    $('findCount').textContent = q ? 'keep typing…' : '';
    return;
  }
  $('findCount').textContent = 'searching…';
  allTimer = setTimeout(() => void allSearch(q), 350);
}

async function allSearch(q) {
  const mine = ++allSeq;
  const v = likeValue(q);
  const [ev, jr] = await Promise.all([
    supabase.from('room_events')
      // Deliberately NOT `payload`: one file version runs to hundreds of KB
      // and a search would pull every match's full contents. Snippets for
      // payload hits are fetched per row, when the row is on screen.
      .select('id,session_id,kind,round,agent_name,ts,text,name:payload->>name')
      .or(SOURCES.map((s) => `${s}.ilike.${v}`).join(','))
      .order('id', { ascending: false }).limit(80),
    supabase.from('room_journals')
      .select('id,session_id,round,agent_name,ts,text')
      .ilike('text', `*${q}*`).order('id', { ascending: false }).limit(40),
  ]);
  if (mine !== allSeq || query !== q) return;    // a newer keystroke won
  if (ev.error && jr.error) {
    $('findCount').textContent = 'search failed';
    renderHits(null, ev.error.message);
    return;
  }
  const rows = [
    ...(ev.data || []),
    ...(jr.data || []).map((r) => ({ ...r, kind: 'journal', id: null })),
  ].sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  const sessions = new Set(rows.map((r) => r.session_id));
  $('findCount').textContent = rows.length
    ? `${rows.length} in ${sessions.size} run${sessions.size === 1 ? '' : 's'}` : '0 found';
  renderHits(rows);
}

/** ±70 characters around the match, with the match marked. */
function snippetOf(text, q) {
  const i = (text || '').toLowerCase().indexOf(q);
  if (i < 0) return null;
  const from = Math.max(0, i - 70);
  const frag = document.createDocumentFragment();
  frag.append((from ? '…' : '') + text.slice(from, i));
  const m = document.createElement('mark');
  m.textContent = text.slice(i, i + q.length);
  frag.append(m, text.slice(i + q.length, i + q.length + 70) + (text.length > i + q.length + 70 ? '…' : ''));
  return frag;
}

// Payload snippets load only for rows scrolled into view — a result list can
// name a dozen 60k files, and nobody reads all of them.
const snipObserver = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    snipObserver.unobserve(e.target);
    void fillSnippet(e.target);
  }
}, { rootMargin: '80px' });

async function fillSnippet(node) {
  const { data } = await supabase.from('room_events').select('payload').eq('id', node._id).maybeSingle();
  const p = data?.payload;
  if (!p) return;
  for (const key of ['content', 'thinking', 'code', 'output', 'query', 'results']) {
    const frag = typeof p[key] === 'string' ? snippetOf(p[key], node._q) : null;
    if (frag) { node.textContent = ''; node.appendChild(frag); return; }
  }
}

function renderHits(rows, err) {
  const box = $('hits');
  box.innerHTML = '';
  box.hidden = false;
  if (err) { box.appendChild(mk('div', 'note', err)); return; }
  if (!rows.length) {
    box.appendChild(mk('div', 'note', `Nothing in any run matches “${query}”.`));
    return;
  }
  for (const r of rows) {
    const b = document.createElement('button');
    b.className = 'hit';
    b.type = 'button';
    const where = mk('div', 'where');
    const arm = document.createElement('b');
    arm.textContent = sessionLabel(r.session_id);
    where.append(arm, ` · round ${r.round} · ${r.agent_name || 'the room'} · `
      + `${VERB[r.kind] || r.kind}${r.kind === 'file' && r.name ? ` ${r.name}` : ''}`);
    const snip = mk('div', 'snip');
    const direct = snippetOf(r.text, query);
    if (direct) snip.appendChild(direct);
    else {
      // The match is inside the payload we deliberately did not fetch.
      snip.textContent = r.name ? `(in ${r.name})` : '(in this action)';
      if (r.id != null) { snip._id = r.id; snip._q = query; snipObserver.observe(snip); }
    }
    b.append(where, snip);
    b.onclick = () => void openHit(r);
    box.appendChild(b);
  }
}

/** Open the run a result came from, and land on the event itself. */
async function openHit(r) {
  // showSession() calls clearSearch(), which empties the box — so hold the
  // query across the jump. Losing it would also leave revealMatch matching
  // the empty string, which opens every disclosure on the page.
  const q = $('find').value;
  $('hits').hidden = true;
  pinned = r.session_id;                          // don't get yanked to the live room
  if (r.session_id !== currentSession) {
    $('sessions').value = r.session_id;
    await showSession(r.session_id);
  }
  $('find').value = q;
  query = q.trim().toLowerCase();
  const node = r.id != null && feed.querySelector(`[data-event-id="${r.id}"]`);
  if (!node) { toBottom(false); return; }
  revealMatch(node);
  node.scrollIntoView({ block: 'start' });
  node.classList.remove('landed');
  void node.offsetWidth;                          // restart the animation
  node.classList.add('landed');
}

for (const a of $('scope').children) {
  a.onclick = (e) => {
    e.preventDefault();
    scope = a.dataset.scope;
    for (const x of $('scope').children) x.classList.toggle('on', x === a);
    $('find').placeholder = scope === 'all' ? 'find in every run…' : 'find in transcript…';
    runSearch();
  };
}
// The panel closes when you pick a result so you can read it; coming back to
// the box brings the same results back rather than making you retype.
$('find').addEventListener('focus', () => {
  if (scope === 'all' && $('hits').children.length && query) $('hits').hidden = false;
});
// Clicking away closes the results, but not when the click is the search box.
addEventListener('mousedown', (e) => {
  if ($('hits').hidden) return;
  if (e.target.closest('#hits') || e.target.closest('#find') || e.target.closest('#scope')) return;
  $('hits').hidden = true;
});

// ── The round rail ─────────────────────────────────────────────────────────
// One square per round, on the outer edge; hovering opens a flyout with one
// dot per seat that acted in that round, and clicking a dot jumps to that
// seat's first event in it. Modelled on joint-session's TurnMinimap, with the
// unit changed: there a turn was keyed off the human message that began it,
// and this room has no human. Rounds are the equivalent beat, and the `round`
// on every event already carries them — no new bookkeeping.
//
// NOT keyed off `order` events: those are emitted per SHUFFLE (2–4 a session),
// not per round, so a rail built from them silently skips most of the room.
const MAX_SQUARES = 30;
const rounds = new Map();   // round -> { first: el, seats: Map(agentId -> el) }
let activeRound = null;

function noteRound(e, el) {
  const r = Number(e.round);
  if (!Number.isFinite(r) || r <= 0) return;
  // Stamped so the search can say WHICH round a hit is in without walking
  // back up the feed.
  el.dataset.round = String(r);
  let rec = rounds.get(r);
  if (!rec) { rec = { first: el, seats: new Map() }; rounds.set(r, rec); }
  const id = e.agent_id;
  // The first element a seat produces in a round is the jump target: a seat
  // that acted then spoke should land you at the action, which is where its
  // turn actually starts.
  if (id && id !== 'admin' && !rec.seats.has(id)) rec.seats.set(id, { el, name: e.agent_name || id });
  paintRail();
}

function clearRounds() {
  rounds.clear(); activeRound = null;
  $('rounds').hidden = true; $('rounds').innerHTML = '';
  $('roundFly').hidden = true;
}

// A ROUND jump lands its first element at the top of the viewport — above
// the scroll-spy's probe line, so the square you clicked is the one that
// lights up. Centring it (the obvious choice) puts it at 50%, below the 35%
// probe, and the rail highlights the PREVIOUS round: correct by the spy's
// rule, and baffling to look at.
const jumpToRound = (el) => el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
// A SEAT jump centres, which reads better for one message — and the round's
// own header is then above the probe, so the spy still agrees.
const jumpTo = (el) => el?.scrollIntoView({ behavior: 'smooth', block: 'center' });

let railPaint = null;
function paintRail() {
  // Coalesce: a session load renders hundreds of events in a tight loop.
  if (railPaint) return;
  railPaint = requestAnimationFrame(() => { railPaint = null; drawRail(); });
}

function drawRail() {
  const nav = $('rounds');
  const all = [...rounds.keys()].sort((a, b) => a - b);
  if (all.length < 2) { nav.hidden = true; nav.innerHTML = ''; return; }
  const shown = all.slice(-MAX_SQUARES);
  const hidden = all.length - shown.length;
  nav.innerHTML = '';
  const cap = document.createElement('span');
  cap.className = 'cap';
  cap.textContent = 'jump to round';
  cap.title = `${all.length} rounds — hover a square for the seats that acted`;
  nav.appendChild(cap);
  if (hidden > 0) {
    const more = document.createElement('span');
    more.className = 'more';
    more.textContent = `+${hidden}`;
    nav.appendChild(more);
  }
  for (const r of shown) {
    const rec = rounds.get(r);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sq' + (activeRound === r ? ' here' : '') + (hitRounds.has(r) ? ' hit' : '');
    b.dataset.round = String(r);
    b.title = `round ${r} — ${rec.seats.size} seat${rec.seats.size === 1 ? '' : 's'}`;
    b.setAttribute('aria-label', `Jump to round ${r}`);
    if (activeRound === r) b.setAttribute('aria-current', 'true');
    b.onclick = () => jumpToRound(rec.first);
    b.onmouseenter = () => openFly(b, r);
    b.onfocus = () => openFly(b, r);
    nav.appendChild(b);
  }
  nav.hidden = false;
}

function openFly(sq, r) {
  const rec = rounds.get(r);
  const fly = $('roundFly');
  fly.innerHTML = '';
  const lab = document.createElement('span');
  lab.className = 'lab';
  lab.textContent = `round ${r}`;
  fly.appendChild(lab);
  for (const [agentId, seat] of rec.seats) {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'dot';
    d.style.background = colorOf(agentId);
    d.title = `Jump to ${seat.name}`;
    d.setAttribute('aria-label', `Jump to ${seat.name} in round ${r}`);
    d.onclick = () => jumpTo(seat.el);
    fly.appendChild(d);
  }
  if (!rec.seats.size) {
    const none = document.createElement('span');
    none.className = 'lab';
    none.textContent = 'no seats';
    fly.appendChild(none);
  }
  fly.hidden = false;
  // Measure AFTER it has content, from the square's own rect.
  const rect = sq.getBoundingClientRect();
  const fw = fly.offsetWidth, fh = fly.offsetHeight;
  let left = rect.right + 10;
  if (left + fw > window.innerWidth - 8) left = Math.max(8, rect.left - fw - 10);
  let top = rect.top + rect.height / 2 - fh / 2;
  top = Math.max(8, Math.min(top, window.innerHeight - fh - 8));
  fly.style.left = `${left}px`;
  fly.style.top = `${top}px`;
}
const closeFly = () => { $('roundFly').hidden = true; };
$('rounds').addEventListener('mouseleave', (ev) => {
  if ($('roundFly').contains(ev.relatedTarget)) return;
  closeFly();
});
$('roundFly').addEventListener('mouseleave', (ev) => {
  if ($('rounds').contains(ev.relatedTarget)) return;
  closeFly();
});

/** Which round is the reader in? The last one whose first element is at or
 *  above a probe line ~35% down the viewport — a table-of-contents spy. */
let spyPaint = null;
function spyRound() {
  if (spyPaint) return;
  spyPaint = requestAnimationFrame(() => {
    spyPaint = null;
    if (!rounds.size) return;
    const probe = window.innerHeight * 0.35;
    let last = null, firstSeen = null;
    for (const r of [...rounds.keys()].sort((a, b) => a - b)) {
      const el = rounds.get(r).first;
      if (!el.isConnected) continue;
      const top = el.getBoundingClientRect().top;
      if (firstSeen === null) firstSeen = r;
      if (top <= probe) last = r;
    }
    const next = last ?? firstSeen;
    if (next === activeRound) return;
    activeRound = next;
    for (const b of $('rounds').querySelectorAll('button.sq')) {
      const on = Number(b.dataset.round) === activeRound;
      b.classList.toggle('here', on);
      if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    }
  });
}

// ── Session loading ────────────────────────────────────────────────────────
let currentSession = null;
let channels = [];

async function loadSessions() {
  const { data, error } = await supabase
    .from('room_sessions').select('session_id').order('latest_id', { ascending: false });
  if (error) { setStatus(error.message); return []; }
  return (data || []).map((r) => r.session_id);
}

// Which arm each session ran. The picker used to list bare ids, so telling
// a `site-open` run from a `project-whittle` one meant opening it. Read
// from the `meta` row — the same place the ledger reads it.
const ARMS = new Map();
async function loadArms() {
  // Never let a labelling nicety take the viewer down: if this fails for any
  // reason the picker falls back to bare session ids, which is what it
  // showed before. (Caught the hard way — a throw in here left the page with
  // an empty session list and no transcript at all.)
  try {
    for (let from = 0; ; from += 1000) {
      const { data, error } = await supabase.from('room_events')
        .select('session_id,cond:payload->condition->>name')
        .eq('kind', 'meta').order('id', { ascending: true }).range(from, from + 999);
      if (error) return;
      for (const r of data || []) {
        // First meta wins: a re-stamped session keeps the run it started as.
        if (r.cond && !ARMS.has(r.session_id)) ARMS.set(r.session_id, r.cond);
      }
      if (!data || data.length < 1000) return;
    }
  } catch (err) { console.error('arm labels:', err); }
}

/** `2026-08-30T20-15-31` → `site-open · 2026-08-30 20:15`. */
function sessionLabel(id) {
  const when = `${id.slice(0, 10)} ${id.slice(11, 16).replace('-', ':')}`;
  const arm = ARMS.get(id);
  return arm ? `${arm} · ${when}` : id;
}

async function showSession(sessionId) {
  currentSession = sessionId;
  $('views').hidden = true;
  // The URL names the session on screen — but ONLY when it is not the
  // newest one. `pinned` is read back from this parameter on load, so
  // stamping it unconditionally meant the page pinned itself: reload the
  // live viewer once and it stopped following new sessions forever, having
  // mistaken its own bookkeeping for someone's deliberate link.
  const isNewest = sessionId === newestSession;
  history.replaceState(null, '', !isNewest && sessionId ? `?session=${encodeURIComponent(sessionId)}` : location.pathname);
  feed.innerHTML = ''; journalList.innerHTML = ''; journalSections.clear(); $('cond').textContent = '';
  clearRounds(); unseen = 0; paintPill(); toolRun = null; clearSearch();
  fileList.innerHTML = ''; fileSections.clear(); $('filesWrap').hidden = true;
  madeSomething = false; $('views').hidden = true;
  toolList.innerHTML = ''; toolSections.clear(); $('toolsWrap').hidden = true;
  seenJournalIds.clear(); seenEventSeqs.clear();
  meta = null; ended = false; clock.textContent = '';
  channels.forEach((c) => supabase.removeChannel(c)); channels = [];

  const [ev, jr] = await Promise.all([
    supabase.from('room_events').select('*').eq('session_id', sessionId).order('seq', { ascending: true }),
    supabase.from('room_journals').select('*').eq('session_id', sessionId).order('id', { ascending: true }),
  ]);
  if (ev.error) { setStatus(ev.error.message); return; }
  (ev.data || []).forEach(render);
  (jr.data || []).forEach(renderJournal);
  // A freshly-opened session starts at the bottom, following.
  toBottom(false);
  spyRound();
  if (!ended) setStatus('live');

  channels.push(supabase
    .channel(`room-${sessionId}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'room_events', filter: `session_id=eq.${sessionId}` },
      // try/catch: one malformed row must not throw inside the realtime
      // callback and silently wedge the subscription (seen live 2026-08-25
      // — the end-of-session update errored until a session re-select).
      (p) => { try { render(p.new); followOrCount(1); spyRound(); } catch (err) { console.error('render:', err, p.new); } })
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'room_journals', filter: `session_id=eq.${sessionId}` },
      (p) => { try { renderJournal(p.new); } catch (err) { console.error('renderJournal:', err, p.new); } })
    .subscribe((s) => {
      if (ended) return;
      setStatus(s === 'SUBSCRIBED' ? 'live' : s.toLowerCase());
    }));
}

async function refreshSessions(selectNewest) {
  const sessions = await loadSessions();
  // A session with no arm yet is one whose `meta` landed after the last
  // sweep — the live room, usually — so re-read rather than label it bare.
  if (sessions.some((s) => !ARMS.has(s))) await loadArms();
  newestSession = sessions[0] ?? null;
  const sel = $('sessions');
  sel.innerHTML = '';
  for (const s of sessions) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = sessionLabel(s);
    sel.appendChild(opt);
  }
  if (!sessions.length) { setStatus('no sessions yet'); return; }
  if (pinned && sessions.includes(pinned) && pinned !== currentSession) {
    sel.value = pinned;
    showSession(pinned);
    return;
  }
  if (selectNewest || !currentSession || !sessions.includes(currentSession)) {
    sel.value = sessions[0];
    showSession(sessions[0]);
  } else {
    sel.value = currentSession;
  }
}

// §9.8: `?session=` opens a specific room — the other half of the switch on
// site.html, so the two views hand the session back and forth.
let pinned = new URLSearchParams(location.search).get('session');
// The newest session id, from the last listing — what "am I following the
// live room?" is decided against.
let newestSession = null;

/** The switch appears only once THIS session has MADE something; a room that
 *  built nothing has no second view, and offering one would be a broken
 *  promise. Called as file and run events arrive, so it turns on mid-session
 *  the moment a room first writes or runs anything.
 *
 *  The two halves are separate promises: `made` covers any file or code run,
 *  `site` needs a page to serve, so a project room gets the workspace with
 *  the site view greyed out rather than a link to an empty frame. */
function updateViews() {
  const q = encodeURIComponent(currentSession ?? '');
  const hasPage = fileSections.has(SITE_FILE);
  $('views').hidden = !(hasPage || madeSomething);
  $('toSite').classList.toggle('off', !hasPage);
  $('toSite').href = `./site.html?session=${q}`;
  $('toMade').href = `./made.html?session=${q}`;
}

$('sessions').onchange = (e) => { pinned = null; showSession(e.target.value); };
refreshSessions(true);
// A brand-new session = first rows under an unseen session_id; cheap poll to
// pick it up and jump there — unless the URL asked for a particular session,
// in which case yanking the reader to a different room is the last thing to
// do (a ?session= link is usually someone comparing a page with its room).
setInterval(async () => {
  if (pinned) return;
  const sessions = await loadSessions();
  if (sessions.length && sessions[0] !== $('sessions').options[0]?.value) refreshSessions(true);
}, 5000);

// ── Admin (behind the status dot) ──────────────────────────────────────────
const modal = $('adminModal');
let adminPw = sessionStorage.getItem('room-admin-pw') || '';

// Condition (i): what each named condition changes vs control, generated at
// deploy time from conditions/*.json (conditions.json sits next to this page).
let CONDITION_INFO = null;
async function loadConditionInfo() {
  if (CONDITION_INFO) return CONDITION_INFO;
  try { CONDITION_INFO = await (await fetch('conditions.json')).json(); }
  catch { CONDITION_INFO = []; }
  return CONDITION_INFO;
}

// ── The condition picker ───────────────────────────────────────────────────
// One list, not three. The old panel asked "which condition" in a dropdown,
// again in a free-text batch field, and a third time in a checkbox grid, with
// undocumented precedence between them; a typo in the free-text field failed
// silently. Selection here IS the answer, and `plan` says what to do with it.
const picked = new Set();

async function buildPicker() {
  const info = await loadConditionInfo();
  const names = info.length ? info.map((c) => c.name) : CONDITIONS;
  const list = $('pickList');
  list.innerHTML = '';
  for (const name of names) {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.name = name;
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = `pk-${name}`;
    const label = document.createElement('label');
    label.className = 'name'; label.htmlFor = cb.id; label.textContent = name;
    label.style.textTransform = 'none'; label.style.letterSpacing = '0';
    label.style.color = 'var(--text)'; label.style.fontSize = '0.85rem';
    const i = document.createElement('button');
    i.type = 'button'; i.className = 'i'; i.textContent = 'ⓘ';
    i.title = 'what this condition changes';
    const desc = document.createElement('div');
    desc.className = 'desc'; desc.hidden = true;
    cb.addEventListener('change', () => {
      cb.checked ? picked.add(name) : picked.delete(name);
      row.classList.toggle('sel', cb.checked);
      updateSummary();
    });
    i.addEventListener('click', () => {
      if (!desc.hidden) { desc.hidden = true; return; }
      const c = info.find((x) => x.name === name);
      desc.innerHTML = '';
      const d = document.createElement('div');
      d.textContent = c ? c.description
        : 'No info for this condition (redeploy the viewer to regenerate conditions.json).';
      desc.appendChild(d);
      if (c && Object.keys(c.overrides || {}).length) {
        const pre = document.createElement('pre');
        pre.textContent = 'changes vs control:\n' + JSON.stringify(c.overrides, null, 2);
        desc.appendChild(pre);
      } else if (c) {
        const n = document.createElement('div');
        n.textContent = 'no overrides — this IS the control state';
        desc.appendChild(n);
      }
      desc.hidden = false;
    });
    row.append(cb, label, i);
    list.append(row, desc);
  }
}

$('pickSearch').addEventListener('input', () => {
  const q = $('pickSearch').value.trim().toLowerCase();
  for (const row of $('pickList').querySelectorAll('.item')) {
    const hit = !q || row.dataset.name.includes(q);
    row.hidden = !hit;
    if (row.nextElementSibling?.className === 'desc' && !hit) row.nextElementSibling.hidden = true;
  }
});
$('pickClear').onclick = () => {
  picked.clear();
  for (const cb of $('pickList').querySelectorAll('input')) cb.checked = false;
  for (const row of $('pickList').querySelectorAll('.item')) row.classList.remove('sel');
  updateSummary();
};

const planMode = () => $('planLoop').checked ? 'loop' : $('planN').checked ? 'n' : 'once';

function updateSummary() {
  const el = $('planSummary');
  const n = picked.size;
  const seats = $('cfgAgents').querySelectorAll('input:checked').length;
  $('pickCount').textContent = n ? `${n} selected` : '';
  if (!n) { el.className = 'summary warn'; el.textContent = 'pick at least one condition'; return; }
  if (!seats) { el.className = 'summary warn'; el.textContent = 'pick at least one seat'; return; }
  const mins = Number($('cfgMinutes').value) || 30;
  const mode = planMode();
  el.className = 'summary';
  if (mode === 'loop') {
    const sets = Number($('cfgLoopSets').value) > 0 ? Number($('cfgLoopSets').value) : null;
    el.textContent = `autopilot: rotating ${n} condition${n > 1 ? 's' : ''}, ${mins} min each, `
      + `${Number($('cfgLoopPause').value) || 0} min gap — ${sets ? `${n * sets} sessions` : 'runs until stopped'}`;
    return;
  }
  const each = mode === 'n' ? (Number($('cfgCount').value) || 1) : 1;
  const total = n * each;
  el.textContent = `${total} session${total > 1 ? 's' : ''} — ${n} condition${n > 1 ? 's' : ''}`
    + (each > 1 ? ` × ${each}` : '') + `, ${mins} min each, ${seats} seat${seats > 1 ? 's' : ''}`;
}
for (const id of ['planOnce', 'planN', 'planLoop', 'cfgCount', 'cfgMinutes', 'cfgLoopPause', 'cfgLoopSets']) {
  $(id).addEventListener('input', updateSummary);
}

// ── Tabs ───────────────────────────────────────────────────────────────────
$('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  for (const b of $('tabs').children) b.classList.toggle('on', b === btn);
  for (const sec of document.querySelectorAll('[data-panel]')) sec.hidden = sec.dataset.panel !== btn.dataset.tab;
  if (btn.dataset.tab === 'runs') loadRuns();
});

dot.addEventListener('click', () => {
  $('adminLogin').hidden = !!adminPw;
  $('adminPanel').hidden = !adminPw;
  if (!$('pickList').children.length) buildPicker().then(updateSummary);
  if (!$('cfgAgents').children.length) {
    for (const a of CATALOG) {
      const lab = document.createElement('label');
      lab.style.textTransform = 'none'; lab.style.letterSpacing = '0';
      lab.innerHTML = `<input type="checkbox" checked value="${a.id}" /> <span></span>`;
      lab.querySelector('span').textContent = a.name;
      lab.querySelector('span').style.color = a.color;
      lab.querySelector('input').addEventListener('change', updateSummary);
      $('cfgAgents').appendChild(lab);
    }
    updateSummary();
  }
  modal.showModal();
  if (!$('adminPanel').hidden) watchRunner(true);
});
$('closeBtn').onclick = $('closeBtn2').onclick = () => modal.close();
// Stop polling the control plane once nobody is looking at it.
modal.addEventListener('close', () => watchRunner(false));
$('seatsAll').onclick = () => { for (const i of $('cfgAgents').querySelectorAll('input')) i.checked = true; updateSummary(); };
$('seatsNone').onclick = () => { for (const i of $('cfgAgents').querySelectorAll('input')) i.checked = false; updateSummary(); };

async function adminCall(body) {
  const res = await fetch(ADMIN_FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ANON_KEY}` },
    body: JSON.stringify({ password: adminPw, ...body }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

$('loginBtn').onclick = async () => {
  adminPw = $('pw').value;
  $('adminMsg').textContent = 'checking…';
  try {
    await adminCall({ action: 'login' });
    sessionStorage.setItem('room-admin-pw', adminPw);
    $('adminLogin').hidden = true;
    $('adminPanel').hidden = false;
    watchRunner(true);
  } catch (err) {
    adminPw = '';
    $('adminMsg').textContent = err.message;
  }
};

const flash = (t) => { $('adminMsg2').textContent = t; setTimeout(() => { $('adminMsg2').textContent = ''; }, 4000); };

// ── Is anything listening? ─────────────────────────────────────────────────
// A command is an INSERT into a queue. If no runner is polling, the insert
// still succeeds and the panel used to say "start command sent — the runner
// picks it up within ~3s", which was simply false. On 2026-09-01 four start
// commands sat unconsumed for half an hour (the Space had gone to sleep on
// its 48h idle timer) and nothing anywhere said so.
//
// The runner marks a command consumed BEFORE executing it, so an unconsumed
// command more than a few seconds old means nobody is reading the queue.
const STALE_SEC = 20;

function setRunner(cls, text, hint) {
  const line = $('runnerLine');
  line.className = `runner ${cls}`;
  line.textContent = text;
  if (hint) {
    const h = document.createElement('span');
    h.className = 'hint';
    h.textContent = hint;
    line.appendChild(h);
  }
}

async function refreshRunner() {
  if (!adminPw || $('adminPanel').hidden) return null;
  let s;
  try {
    s = await adminCall({ action: 'status' });
  } catch (err) {
    setRunner('bad', `cannot reach the control plane: ${err.message}`);
    return null;
  }
  const age = s.oldestPendingAgeSec;
  if (s.pending && age != null && age >= STALE_SEC) {
    setRunner('bad',
      `runner NOT LISTENING — ${s.pending} command${s.pending === 1 ? '' : 's'} queued, `
      + `oldest ${fmtAge(age)} old`,
      'The runner Space is probably asleep (it sleeps on a 48h idle timer). '
      + 'Open it once to wake it, then re-send: '
      + 'huggingface.co/spaces/brick-factorial/the-room-runner');
  } else if (s.pending) {
    setRunner('busy', `${s.pending} command${s.pending === 1 ? '' : 's'} queued, just sent — waiting for the runner…`);
  } else {
    setRunner('ok', 'runner listening — the queue is empty');
  }
  return s;
}

const fmtAge = (sec) => sec < 90 ? `${sec}s` : sec < 5400 ? `${Math.round(sec / 60)}m` : `${Math.round(sec / 3600)}h`;

/** After a start: did the runner actually take it, and did a room appear?
 *
 *  Two different failures, and they need different answers — "nobody took
 *  the command" is a sleeping Space, "took it but no room started" is a
 *  runner that is up and failing (a missing API key, a crash on boot). */
async function watchCommand(id, label, expectSession) {
  if (id == null) return;                        // older edge fn: no id to watch
  const before = newestSession;
  for (let waited = 0; waited < STALE_SEC; waited += 2) {
    await new Promise((r) => setTimeout(r, 2000));
    let s;
    try { s = await adminCall({ action: 'status', payload: { id } }); } catch { continue; }
    if (!s.commandConsumed) continue;
    // Only a START owes us a room. Chasing one after a `stop` would end in
    // "no room opened", which is exactly what a stop is supposed to do.
    if (!expectSession) { setRunner('ok', `${label} — the runner took it`); return; }
    setRunner('busy', `${label} — the runner took it; waiting for the room to open…`);
    return void watchForSession(before);
  }
  await refreshRunner();                          // paints the NOT LISTENING line
}

/** A taken command should produce a new session within the start delay. */
async function watchForSession(before) {
  for (let waited = 0; waited < 120; waited += 5) {
    await new Promise((r) => setTimeout(r, 5000));
    const sessions = await loadSessions();
    if (sessions.length && sessions[0] !== before) {
      setRunner('ok', `room open: ${sessionLabel(sessions[0])}`);
      refreshSessions(true);
      return;
    }
  }
  setRunner('bad', 'the runner took the command but no room opened in 2 minutes',
    'The runner is up and failing — check its logs: hf spaces logs brick-factorial/the-room-runner');
}

let runnerTimer = null;
function watchRunner(on) {
  clearInterval(runnerTimer);
  runnerTimer = on ? setInterval(() => void refreshRunner(), 10000) : null;
  if (on) void refreshRunner();
}

$('startBtn').onclick = async () => {
  const conditions = [...picked];
  if (!conditions.length) return flash('pick at least one condition');
  const agentIds = [...$('cfgAgents').querySelectorAll('input:checked')].map((i) => i.value);
  if (!agentIds.length) return flash('pick at least one seat');
  // Only send a seat override when the selection actually narrows the
  // catalog — otherwise it would clobber seat/persona assignments that a
  // named condition defines (the meta stamp would then faithfully record
  // the wrong resolution, invisibly).
  const seatOverride = agentIds.length < CATALOG.length ? { agentIds } : {};
  const base = {
    condition: conditions[0],
    ...seatOverride,
    minutes: Number($('cfgMinutes').value) || 30,
    delaySeconds: Number($('cfgDelay').value) || 8,
    shuffle: { kind: $('cfgShuffle').value },
  };
  const mode = planMode();
  try {
    if (mode === 'loop') {
      const sets = Number($('cfgLoopSets').value) > 0 ? Number($('cfgLoopSets').value) : undefined;
      const r = await adminCall({ action: 'command', kind: 'start', payload: { ...base, loop: {
        conditions, pauseMinutes: Number($('cfgLoopPause').value) || 10, sets,
      }}});
      flash('autopilot on — rotating ' + conditions.join(', '));
      void watchCommand(r.id, 'autopilot', true);
      return;
    }
    // A plain start is just the 1×[condition] case, so only send `batch`
    // when it actually batches.
    const count = mode === 'n' ? (Number($('cfgCount').value) || 1) : 1;
    const batch = count > 1 || conditions.length > 1 ? { batch: { count, conditions } } : {};
    const r = await adminCall({ action: 'command', kind: 'start', payload: { ...base, ...batch } });
    const total = count * conditions.length;
    const label = total > 1 ? `batch of ${total}` : 'start';
    // "sent" is not "running": the line below says which, and says so even
    // when the answer is that nothing took it.
    flash(total > 1 ? `batch start sent — ${total} sessions, interleaved` : 'start command sent');
    setRunner('busy', `${label} sent — waiting for the runner to take it…`);
    void watchCommand(r.id, `${label} sent`, true);
  } catch (err) { flash(err.message); setRunner('bad', `send failed: ${err.message}`); }
};

$('loopStopBtn').onclick = async () => {
  try { await adminCall({ action: 'command', kind: 'stop', payload: { scope: 'loop' } }); flash('autopilot off (current session finishes)'); }
  catch (err) { flash(err.message); }
};

$('stopBtn').onclick = async () => {
  // A stop nobody takes is as silent as a start nobody takes.
  try {
    const r = await adminCall({ action: 'command', kind: 'stop' });
    flash('stop sent');
    setRunner('busy', 'stop sent — waiting for the runner to take it…');
    void watchCommand(r.id, 'stop sent');
  } catch (err) { flash(err.message); setRunner('bad', `send failed: ${err.message}`); }
};

$('sayBtn').onclick = async () => {
  const text = $('sayText').value.trim();
  if (!text) return;
  try {
    await adminCall({ action: 'command', kind: 'say', payload: { text } });
    $('sayText').value = '';
    flash('sent — lands before the next turn');
  } catch (err) { flash(err.message); }
};

// ── Runs: the ledger ───────────────────────────────────────────────────────
// Which arms have actually been run, how many times, how long they lasted,
// how many rounds, which seats, and a way back into each transcript. Reads
// the `meta` and `end` events — the two rows per session that carry it.
//
// TASK vs CHAT: a task room is one that was given something to make, and the
// mark of that is a `completion` block naming the artifact (`target`). Every
// site arm carries one — including the unending arms, where it is present
// with `enabled: false` — and no open-ended condition does. Deliberately not
// a name prefix: a future task condition that is not called site-* still
// classifies correctly, as long as it declares what is being made.
let RUNS = null;
let runsKind = 'all';

const isTask = (s) => !!s.completion?.target;

async function fetchRuns() {
  const cols = 'session_id,kind,ts,cond:payload->condition->>name,mins:payload->>durationMinutes,'
    + 'agents:payload->agents,completion:payload->condition->completion,'
    + 'ending:payload->>ending,rounds:payload->>rounds';
  let { data, error } = await supabase.from('room_events').select(cols)
    .in('kind', ['meta', 'end']).order('id', { ascending: true });
  if (error) {
    // Older PostgREST without json-path projection: fall back to whole
    // payloads rather than showing an empty tab.
    const full = await supabase.from('room_events').select('session_id,kind,ts,payload')
      .in('kind', ['meta', 'end']).order('id', { ascending: true });
    if (full.error) throw new Error(full.error.message);
    data = (full.data || []).map((r) => ({
      session_id: r.session_id, kind: r.kind, ts: r.ts,
      cond: r.payload?.condition?.name, mins: r.payload?.durationMinutes,
      agents: r.payload?.agents, completion: r.payload?.condition?.completion,
      ending: r.payload?.ending, rounds: r.payload?.rounds,
    }));
  }
  const byId = new Map();
  for (const r of data || []) {
    let s = byId.get(r.session_id);
    if (!s) { s = { id: r.session_id }; byId.set(r.session_id, s); }
    if (r.kind === 'meta') {
      // First meta wins: a re-stamped session keeps the run it started as.
      if (!s.start) {
        s.cond = r.cond; s.mins = Number(r.mins) || null; s.agents = r.agents || [];
        s.completion = r.completion; s.start = r.ts;
      }
    } else if (!s.end) {
      s.ending = r.ending; s.end = r.ts;
      if (r.rounds != null) s.rounds = Number(r.rounds);
    }
  }
  const runs = [...byId.values()].filter((s) => s.cond);
  await fillRounds(runs);
  return runs;
}

// Sessions recorded before the runner stamped `rounds` into the end event
// have to be counted from their rows. Only those, and only the (session_id,
// round) pair — so this shrinks to nothing as the stamped sessions accrue.
// Paged, because PostgREST caps a response at 1000 rows and a silent
// truncation here would under-report a long session's rounds.
async function fillRounds(runs) {
  const missing = runs.filter((s) => s.rounds == null).map((s) => s.id);
  if (!missing.length) return;
  const max = new Map();
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await supabase.from('room_events').select('session_id,round')
      .in('session_id', missing).gte('round', 0)
      .order('id', { ascending: true }).range(from, from + PAGE - 1);
    if (error) return;                       // leave them blank rather than wrong
    for (const r of data || []) {
      const cur = max.get(r.session_id) ?? 0;
      if (r.round > cur) max.set(r.session_id, r.round);
    }
    if (!data || data.length < PAGE) break;
  }
  for (const s of runs) if (s.rounds == null) s.rounds = max.get(s.id) ?? null;
}

const seatLabel = (agents) => {
  const names = (agents || []).map((a) => String(a.name || a.id || '').split(' ')[0]);
  if (!names.length) return '—';
  return names.length === CATALOG.length ? `all ${names.length}` : names.join('·');
};

function renderRuns() {
  const body = $('runsBody');
  body.innerHTML = '';
  const all = RUNS;
  const shown = runsKind === 'all' ? all : all.filter((s) => (runsKind === 'task') === isTask(s));
  const tasks = all.filter(isTask).length;
  for (const b of $('runsFilter').children) {
    const k = b.dataset.kind;
    b.classList.toggle('on', k === runsKind);
    b.textContent = k === 'all' ? `all ${all.length}` : k === 'task' ? `task ${tasks}` : `chat ${all.length - tasks}`;
  }
  const arms = new Map();
  for (const s of shown) {
    if (!arms.has(s.cond)) arms.set(s.cond, []);
    arms.get(s.cond).push(s);
  }
  const running = shown.filter((s) => !s.end).length;
  $('runsSummary').textContent = `${shown.length} sessions · ${arms.size} arms`
    + (running ? ` · ${running} unfinished` : '');
  const order = [...arms.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  for (const [cond, runs] of order) {
    const arm = document.createElement('div');
    arm.className = 'arm';
    const h = document.createElement('h3');
    h.textContent = cond;
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = `${runs.length} run${runs.length > 1 ? 's' : ''}`;
    h.appendChild(n);
    const table = document.createElement('table');
    for (const s of runs.sort((a, b) => (b.start || '').localeCompare(a.start || ''))) {
      const tr = document.createElement('tr');
      const td = (text, cls) => {
        const c = document.createElement('td');
        c.textContent = text; if (cls) c.className = cls;
        return c;
      };
      const actual = s.start && s.end
        ? ((new Date(s.end) - new Date(s.start)) / 60000).toFixed(1) : null;
      const how = td(s.ending || '—', 'when' + (s.ending === 'agreement' ? ' agree' : ''));
      const link = document.createElement('td');
      link.className = 'when';
      const a = document.createElement('a');
      a.href = `?session=${encodeURIComponent(s.id)}`;
      a.textContent = 'chat';
      link.appendChild(a);
      // The page link belongs to a room whose artifact IS a page. A project
      // room is a task room too, but its deliverable is a tree of files, and
      // site.html would open on whatever index.html it happened to write.
      if (/\.html?$/i.test(s.completion?.target || '')) {
        const b = document.createElement('a');
        b.href = `./site.html?session=${encodeURIComponent(s.id)}`;
        b.textContent = 'page';
        b.style.marginLeft = '0.5rem';
        link.appendChild(b);
      }
      // Every run gets a way into what it made — the files version by
      // version and the output of everything it ran. A project room's
      // deliverable is a tree, so `page` was the only link it could never
      // have, and the ledger left it with nothing but `chat`.
      const m = document.createElement('a');
      m.href = `./made.html?session=${encodeURIComponent(s.id)}`;
      m.textContent = 'made';
      m.style.marginLeft = '0.5rem';
      link.appendChild(m);
      const seats = td(seatLabel(s.agents));
      seats.title = (s.agents || []).map((a) => a.name || a.id).join(', ');
      tr.append(
        td((s.start || s.id).slice(0, 16).replace('T', ' '), 'when'),
        td(actual ? `${actual}/${s.mins ?? '?'} min` : `${s.mins ?? '?'} min · running`, 'when'),
        td(s.rounds != null ? `${s.rounds} rd` : '—', 'when'),
        how,
        seats,
        link,
      );
      table.appendChild(tr);
    }
    arm.append(h, table);
    body.appendChild(arm);
  }
}

$('runsFilter').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-kind]');
  if (!b || !RUNS) return;
  runsKind = b.dataset.kind;
  renderRuns();
});

async function loadRuns(force) {
  if (RUNS && !force) return renderRuns();
  $('runsSummary').textContent = 'loading…';
  try { RUNS = await fetchRuns(); renderRuns(); }
  catch (err) { $('runsSummary').textContent = err.message; }
}
$('runsRefresh').onclick = () => loadRuns(true);
